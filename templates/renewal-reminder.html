<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
  <div style="background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%); padding: 30px; border-radius: 12px 12px 0 0;">
    <h1 style="color: white; margin: 0; font-size: 24px;">Finova</h1>
  </div>
  <div style="background: #f9fafb; padding: 30px; border-radius: 0 0 12px 12px;">
    <h2 style="color: #111; margin-top: 0;">Halo {{name}},</h2>
    <p style="color: #666;">Langganan Finova Anda akan berakhir pada <strong>{{expiryDate}}</strong>.</p>
    <p style="color: #666;">Perpanjang sekarang untuk terus menikmati fitur premium dan tidak kehilangan akses data Anda.</p>
    <div style="text-align: center; margin: 30px 0;">
      <a href="{{renewalUrl}}" style="background: #0d9488; color: white; padding: 14px 28px; text-decoration: none; border-radius: 8px; font-weight: 600; display: inline-block;">Perpanjang Langganan</a>
    </div>
    <p style="color: #666;">atau klik tautan berikut: <a href="{{renewalUrl}}" style="color: #0d9488;">{{renewalUrl}}</a></p>
    <div style="border-top: 1px solid #e5e7eb; margin-top: 30px; padding-top: 20px; color: #999; font-size: 12px;">
      <p style="margin: 0;">Email ini dikirim secara otomatis oleh Finova.</p>
    </div>
  </div>
</body>
</html>
